[project]
name = "scoresync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian Nguyen", email = "brian.n25@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncmy>=0.2.16",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "fastapi-cache2[redis]>=0.2.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "redis>=4.6.0",
    "selectolax>=1.0.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.4",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]
scrape = [
    "playwright>=1.64.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]                 # allow assert (pytest uses it)

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true